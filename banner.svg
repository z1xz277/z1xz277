<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="z1xz profile banner">
  <defs>
    <style><![CDATA[
      .banner-card {
        fill: #FFFFFF;
        stroke: #E5E5E5;
        stroke-width: 1.2;
      }
      .main-name {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1.5px;
        fill: #000000;
      }
      .bio-sub {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #333333;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #111111;
        letter-spacing: 1.2px;
      }
      .username-sub {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #666666;
      }

      /* ====== VORTEX ANIMATIONS ====== */
      .spin-slow    { transform-origin: 640px 105px; animation: spin 18s linear infinite; }
      .spin-med     { transform-origin: 640px 105px; animation: spin 10s linear infinite; }
      .spin-fast    { transform-origin: 640px 105px; animation: spin 5s linear infinite; }
      .spin-xslow   { transform-origin: 640px 105px; animation: spin 32s linear infinite; }
      .spin-ccw-med { transform-origin: 640px 105px; animation: spin-ccw 14s linear infinite; }
      .spin-ccw-slow{ transform-origin: 640px 105px; animation: spin-ccw 24s linear infinite; }
      .spin-ccw-fast{ transform-origin: 640px 105px; animation: spin-ccw 7s linear infinite; }

      @keyframes spin     { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
      @keyframes spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg);    } }

      .pulse-core {
        transform-origin: 640px 105px;
        animation: pulse 3.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1);    opacity: 0.85; }
        50%      { transform: scale(1.18); opacity: 1;    }
      }

      .flicker-1 { animation: flicker 2.6s ease-in-out infinite; }
      .flicker-2 { animation: flicker 3.8s ease-in-out infinite; }
      .flicker-3 { animation: flicker 1.9s ease-in-out infinite; }
      @keyframes flicker {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1;    }
      }

      .wave-text {
        animation: wave 4s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { opacity: 0.75; transform: translateY(0); }
        50%      { opacity: 1;    transform: translateY(-1px); }
      }

      .glitch {
        animation: glitch 6s steps(1) infinite;
      }
      @keyframes glitch {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.6; transform: translateX(1px); }
        97% { opacity: 1;   transform: translateX(-1px); }
      }
    ]]></style>

    <clipPath id="avatar-clip">
      <circle cx="85" cy="185" r="43"/>
    </clipPath>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#111111" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bg-glow" cx="80%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#F4F4F4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ MAIN BACKGROUND ============ -->
  <rect x="0" y="0" width="800" height="260" fill="#F7F7F8"/>

  <!-- ============ BANNER CARD (top 200px) ============ -->
  <rect class="banner-card" x="4" y="4" width="792" height="196" rx="10" ry="10"/>
  <rect x="4" y="4" width="792" height="196" rx="10" ry="10" fill="url(#bg-glow)" opacity="0.55"/>

  <!-- ===== Subtle grid accent on left ===== -->
  <g opacity="0.07" stroke="#000" stroke-width="0.6">
    <line x1="40"  y1="20"  x2="40"  y2="180"/>
    <line x1="80"  y1="20"  x2="80"  y2="180"/>
    <line x1="120" y1="20"  x2="120" y2="180"/>
    <line x1="20"  y1="60"  x2="220" y2="60"/>
    <line x1="20"  y1="100" x2="220" y2="100"/>
    <line x1="20"  y1="140" x2="220" y2="140"/>
  </g>

  <!-- ===== Decorative dots ===== -->
  <g fill="#000000">
    <circle cx="30"  cy="25"  r="1.8" opacity="0.8"/>
    <circle cx="38"  cy="25"  r="1.8" opacity="0.5"/>
    <circle cx="46"  cy="25"  r="1.8" opacity="0.3"/>
  </g>

  <!-- ===== TYPOGRAPHY BLOCK ===== -->
  <g transform="translate(180,72)">
    <!-- small label -->
    <text x="0" y="0" class="username-sub">// github.com/z1xz</text>

    <!-- MAIN NAME -->
    <text x="-2" y="52" class="main-name glitch">z1xz</text>
    <line x1="0" y1="62" x2="130" y2="62" stroke="#000" stroke-width="2" opacity="0.9"/>

    <!-- BIO SUBTITLE with wave -->
    <g class="wave-text">
      <text x="0" y="92" class="bio-sub">claude tung sahur :&gt;</text>
    </g>

    <!-- WINDYFAX PILL BADGE -->
    <g transform="translate(0,108)">
      <rect x="-6" y="-12" width="88" height="22" rx="11" ry="11"
            fill="none" stroke="#111111" stroke-width="1.2"/>
      <text x="7" y="2" class="pill-text">WINDYFAX</text>
    </g>
  </g>

  <!-- ===== VECTOR VORTEX / TUNNEL ===== -->
  <g>
    <!-- Outermost ring (slow) -->
    <g class="spin-xslow">
      <circle cx="640" cy="105" r="110" fill="none" stroke="#111" stroke-width="0.6" stroke-dasharray="2 8" opacity="0.5"/>
      <circle cx="750" cy="105" r="2.2" fill="#000"/>
      <circle cx="530" cy="105" r="2.2" fill="#000"/>
      <circle cx="640" cy="-5"  r="2.2" fill="#000"/>
      <circle cx="640" cy="215" r="2.2" fill="#000"/>
    </g>

    <!-- Outer geometric ring (ccw slow) -->
    <g class="spin-ccw-slow">
      <circle cx="640" cy="105" r="98" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1 14" opacity="0.7"/>
      <polygon points="640,10 644,16 636,16" fill="#000"/>
      <polygon points="640,200 644,194 636,194" fill="#000"/>
      <polygon points="542,105 548,109 548,101" fill="#000"/>
      <polygon points="738,105 732,109 732,101" fill="#000"/>
    </g>

    <!-- Mid ring fast ccw -->
    <g class="spin-ccw-fast">
      <circle cx="640" cy="105" r="82" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="6 4 1 4" opacity="0.85"/>
      <rect x="637" y="21"  width="6" height="6" fill="#000"/>
      <rect x="637" y="183" width="6" height="6" fill="#000"/>
      <rect x="556" y="102" width="6" height="6" fill="#000"/>
      <rect x="718" y="102" width="6" height="6" fill="#000"/>
    </g>

    <!-- Spiral arcs (cw med) -->
    <g class="spin-med" fill="none" stroke="#000" stroke-linecap="round">
      <path d="M640,105 Q700,80 720,45"  stroke-width="2.2" opacity="0.95"/>
      <path d="M640,105 Q700,130 720,165" stroke-width="2.2" opacity="0.95"/>
      <path d="M640,105 Q580,130 560,165" stroke-width="2.2" opacity="0.95"/>
      <path d="M640,105 Q580,80 560,45"  stroke-width="2.2" opacity="0.95"/>

      <path d="M640,105 Q685,60 670,25"  stroke-width="1.4" opacity="0.7"/>
      <path d="M640,105 Q685,150 670,185" stroke-width="1.4" opacity="0.7"/>
      <path d="M640,105 Q595,150 610,185" stroke-width="1.4" opacity="0.7"/>
      <path d="M640,105 Q595,60 610,25"  stroke-width="1.4" opacity="0.7"/>
    </g>

    <!-- Inner concentric rings (ccw med) -->
    <g class="spin-ccw-med">
      <circle cx="640" cy="105" r="65" fill="none" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.75"/>
      <circle cx="640" cy="105" r="55" fill="none" stroke="#000" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.6"/>
      <g class="flicker-1">
        <circle cx="640" cy="40"  r="2.5" fill="#000"/>
        <circle cx="640" cy="170" r="2.5" fill="#000"/>
        <circle cx="575" cy="105" r="2.5" fill="#000"/>
        <circle cx="705" cy="105" r="2.5" fill="#000"/>
      </g>
    </g>

    <!-- Tight inner fast ring -->
    <g class="spin-fast">
      <circle cx="640" cy="105" r="45" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="2 6" opacity="0.9"/>
      <circle cx="640" cy="60"  r="1.8" fill="#000"/>
      <circle cx="640" cy="150" r="1.8" fill="#000"/>
      <circle cx="595" cy="105" r="1.8" fill="#000"/>
      <circle cx="685" cy="105" r="1.8" fill="#000"/>
    </g>

    <!-- Very inner slow spin (particle field) -->
    <g class="spin-slow">
      <circle cx="640" cy="105" r="30" fill="none" stroke="#000" stroke-width="0.4" stroke-dasharray="1 4" opacity="0.5"/>
      <g class="flicker-2">
        <circle cx="640" cy="75"  r="1.4" fill="#000"/>
        <circle cx="640" cy="135" r="1.4" fill="#000"/>
        <circle cx="610" cy="105" r="1.4" fill="#000"/>
        <circle cx="670" cy="105" r="1.4" fill="#000"/>
        <circle cx="619" cy="84"  r="1" fill="#000"/>
        <circle cx="661" cy="84"  r="1" fill="#000"/>
        <circle cx="619" cy="126" r="1" fill="#000"/>
        <circle cx="661" cy="126" r="1" fill="#000"/>
      </g>
    </g>

    <!-- PULSING BLACK CORE -->
    <circle class="pulse-core" cx="640" cy="105" r="22" fill="url(#core-glow)"/>
    <circle class="pulse-core" cx="640" cy="105" r="14" fill="#000"/>
    <circle cx="640" cy="105" r="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Outer scatter particles (counter-rotating slow) -->
    <g class="spin-ccw-slow" class="flicker-3">
      <circle cx="760" cy="60"  r="1.2" fill="#000" opacity="0.6"/>
      <circle cx="520" cy="150" r="1.2" fill="#000" opacity="0.6"/>
      <circle cx="720" cy="30"  r="1"   fill="#000" opacity="0.5"/>
      <circle cx="560" cy="180" r="1"   fill="#000" opacity="0.5"/>
      <circle cx="780" cy="140" r="1"   fill="#000" opacity="0.4"/>
      <circle cx="500" cy="70"  r="1"   fill="#000" opacity="0.4"/>
    </g>
  </g>

  <!-- ===== PROFILE INFO AREA (below banner) ===== -->

  <!-- Online status dot -->
  <g transform="translate(180,218)">
    <circle cx="0" cy="0" r="4.5" fill="#3BA55C"/>
    <text x="10" y="4" class="username-sub" font-weight="600" fill="#2BA35A">online</text>
  </g>

  <!-- ===== AVATAR (overlapping banner edge) ===== -->
  <!-- White ring border (background) -->
  <circle cx="85" cy="185" r="48" fill="#FFFFFF"/>
  <circle cx="85" cy="185" r="48" fill="none" stroke="#F7F7F8" stroke-width="1"/>

  <!-- Avatar image pulled from GitHub -->
  <g clip-path="url(#avatar-clip)">
    <image href="https://github.com/z1xz.png" x="42" y="142" width="86" height="86" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Outer subtle ring -->
  <circle cx="85" cy="185" r="48" fill="none" stroke="#E5E5E5" stroke-width="0.8"/>

  <!-- Small decorative bottom-right mark -->
  <g transform="translate(720,225)" opacity="0.55">
    <rect x="0"  y="0" width="8"  height="2" fill="#000"/>
    <rect x="12" y="0" width="16" height="2" fill="#000"/>
    <rect x="32" y="0" width="4"  height="2" fill="#000"/>
    <rect x="0"  y="6" width="20" height="2" fill="#000"/>
    <rect x="24" y="6" width="8"  height="2" fill="#000"/>
  </g>

</svg>
