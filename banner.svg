<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" role="img" aria-label="z1xz discord style profile banner">
  <defs>
    <style><![CDATA[
      .name {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1px;
        fill: #FFFFFF;
      }
      .bio {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.4px;
        fill: #FFFFFF;
        opacity: 0.92;
      }
      .pill-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 1.6px;
        fill: #FFFFFF;
      }

      /* ===== TWINKLING STARS ===== */
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; }
        50%      { opacity: 1; }
      }
      .tw1 { animation: twinkle 3.1s ease-in-out infinite; }
      .tw2 { animation: twinkle 4.3s ease-in-out infinite 1.1s; }
      .tw3 { animation: twinkle 2.4s ease-in-out infinite 0.6s; }
      .tw4 { animation: twinkle 5.2s ease-in-out infinite 2.0s; }
      .tw5 { animation: twinkle 3.7s ease-in-out infinite 1.6s; }

      /* ===== MOON AMBIENT GLOW ===== */
      .moon-glow {
        transform-origin: 690px 68px;
        animation: moonpulse 4.5s ease-in-out infinite;
      }
      @keyframes moonpulse {
        0%, 100% { opacity: 0.28; transform: scale(1); }
        50%      { opacity: 0.62; transform: scale(1.08); }
      }
      .moon-body {
        animation: moonbright 4.5s ease-in-out infinite;
      }
      @keyframes moonbright {
        0%, 100% { opacity: 0.92; }
        50%      { opacity: 1; }
      }

      /* ===== SHOOTING STARS ===== */
      @keyframes shoot1 {
        0%   { transform: translate(0, 0);        opacity: 0; }
        3%   { opacity: 1; }
        11%  { transform: translate(-330px, 165px); opacity: 0; }
        100% { transform: translate(-330px, 165px); opacity: 0; }
      }
      @keyframes shoot2 {
        0%   { transform: translate(0, 0);        opacity: 0; }
        3%   { opacity: 1; }
        10%  { transform: translate(-400px, 140px); opacity: 0; }
        100% { transform: translate(-400px, 140px); opacity: 0; }
      }
      .shoot1 { animation: shoot1 11s linear infinite 2s; }
      .shoot2 { animation: shoot2 14s linear infinite 7.5s; }

      /* ===== AVATAR PLACEHOLDER TWINKLE ===== */
      .av-tw { animation: twinkle 3.4s ease-in-out infinite 0.8s; }
    ]]></style>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0B0C10"/>
      <stop offset="60%"  stop-color="#12161F"/>
      <stop offset="100%" stop-color="#1F2833"/>
    </linearGradient>

    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="banner-clip">
      <rect x="4" y="4" width="792" height="196" rx="10" ry="10"/>
    </clipPath>

    <clipPath id="avatar-clip">
      <circle cx="85" cy="185" r="45"/>
    </clipPath>
  </defs>

  <!-- ============ CANVAS / PROFILE BODY ============ -->
  <rect x="0" y="0" width="800" height="260" fill="#0B0C10"/>

  <!-- ============ BANNER CARD (top 200px) ============ -->
  <g clip-path="url(#banner-clip)">
    <!-- night sky -->
    <rect x="4" y="4" width="792" height="196" fill="url(#sky)"/>

    <!-- ===== PIXEL STARS ===== -->
    <g fill="#FFFFFF" shape-rendering="crispEdges">
      <rect class="tw1" x="20"  y="30"  width="2" height="2"/>
      <rect class="tw3" x="45"  y="18"  width="2" height="2"/>
      <rect class="tw2" x="70"  y="52"  width="3" height="3"/>
      <rect class="tw4" x="95"  y="26"  width="2" height="2"/>
      <rect class="tw1" x="120" y="64"  width="2" height="2"/>
      <rect class="tw5" x="150" y="20"  width="2" height="2"/>
      <rect class="tw2" x="175" y="44"  width="2" height="2"/>
      <rect class="tw3" x="205" y="30"  width="3" height="3"/>
      <rect class="tw4" x="235" y="58"  width="2" height="2"/>
      <rect class="tw1" x="265" y="22"  width="2" height="2"/>
      <rect class="tw5" x="295" y="48"  width="2" height="2"/>
      <rect class="tw2" x="325" y="34"  width="2" height="2"/>
      <rect class="tw3" x="355" y="64"  width="3" height="3"/>
      <rect class="tw1" x="385" y="26"  width="2" height="2"/>
      <rect class="tw4" x="415" y="50"  width="2" height="2"/>
      <rect class="tw2" x="445" y="38"  width="2" height="2"/>
      <rect class="tw5" x="475" y="66"  width="2" height="2"/>
      <rect class="tw3" x="505" y="24"  width="3" height="3"/>
      <rect class="tw1" x="535" y="54"  width="2" height="2"/>
      <rect class="tw4" x="565" y="32"  width="2" height="2"/>
      <rect class="tw2" x="595" y="60"  width="2" height="2"/>
      <rect class="tw5" x="625" y="26"  width="2" height="2"/>
      <rect class="tw3" x="655" y="44"  width="2" height="2"/>
      <rect class="tw1" x="730" y="40"  width="2" height="2"/>
      <rect class="tw4" x="760" y="64"  width="3" height="3"/>
      <rect class="tw2" x="780" y="28"  width="2" height="2"/>
      <rect class="tw5" x="30"  y="90"  width="2" height="2"/>
      <rect class="tw2" x="60"  y="110" width="2" height="2"/>
      <rect class="tw4" x="90"  y="86"  width="2" height="2"/>
      <rect class="tw1" x="130" y="102" width="2" height="2"/>
      <rect class="tw3" x="210" y="92"  width="2" height="2"/>
      <rect class="tw5" x="250" y="112" width="2" height="2"/>
      <rect class="tw2" x="290" y="96"  width="2" height="2"/>
      <rect class="tw4" x="330" y="118" width="2" height="2"/>
      <rect class="tw1" x="370" y="90"  width="2" height="2"/>
      <rect class="tw3" x="410" y="108" width="3" height="3"/>
      <rect class="tw5" x="450" y="94"  width="2" height="2"/>
      <rect class="tw2" x="490" y="116" width="2" height="2"/>
      <rect class="tw4" x="530" y="98"  width="2" height="2"/>
      <rect class="tw1" x="570" y="120" width="2" height="2"/>
      <rect class="tw3" x="610" y="96"  width="2" height="2"/>
      <rect class="tw5" x="650" y="112" width="2" height="2"/>
      <rect class="tw2" x="740" y="96"  width="2" height="2"/>
      <rect class="tw4" x="770" y="120" width="2" height="2"/>
      <rect class="tw1" x="755" y="150" width="2" height="2"/>
      <!-- sparkle crosses -->
      <g class="tw3">
        <rect x="108" y="38" width="8" height="2"/>
        <rect x="111" y="35" width="2" height="8"/>
      </g>
      <g class="tw5">
        <rect x="468" y="20" width="8" height="2"/>
        <rect x="471" y="17" width="2" height="8"/>
      </g>
      <g class="tw2">
        <rect x="608" y="130" width="8" height="2"/>
        <rect x="611" y="127" width="2" height="8"/>
      </g>
    </g>

    <!-- ===== SHOOTING STARS ===== -->
    <g class="shoot1" shape-rendering="crispEdges">
      <rect x="520" y="20" width="5" height="5" fill="#FFFFFF"/>
      <rect x="525" y="15" width="4" height="4" fill="#FFFFFF" opacity="0.65"/>
      <rect x="529" y="11" width="3" height="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="532" y="8"  width="2" height="2" fill="#FFFFFF" opacity="0.22"/>
    </g>
    <g class="shoot2" shape-rendering="crispEdges">
      <rect x="760" y="55" width="4" height="4" fill="#FFFFFF"/>
      <rect x="764" y="51" width="3" height="3" fill="#FFFFFF" opacity="0.6"/>
      <rect x="767" y="48" width="2" height="2" fill="#FFFFFF" opacity="0.35"/>
    </g>

    <!-- ===== PIXEL MOON (right side) ===== -->
    <circle class="moon-glow" cx="690" cy="68" r="52" fill="url(#moonglow)"/>
    <g class="moon-body" shape-rendering="crispEdges" transform="translate(662,40) scale(5)">
      <rect x="4"  y="0"  width="3"  height="1" fill="#FFFFFF"/>
      <rect x="3"  y="1"  width="5"  height="1" fill="#FFFFFF"/>
      <rect x="2"  y="2"  width="7"  height="1" fill="#FFFFFF"/>
      <rect x="2"  y="3"  width="7"  height="1" fill="#FFFFFF"/>
      <rect x="1"  y="4"  width="9"  height="1" fill="#FFFFFF"/>
      <rect x="1"  y="5"  width="9"  height="1" fill="#FFFFFF"/>
      <rect x="1"  y="6"  width="9"  height="1" fill="#FFFFFF"/>
      <rect x="2"  y="7"  width="7"  height="1" fill="#FFFFFF"/>
      <rect x="2"  y="8"  width="7"  height="1" fill="#FFFFFF"/>
      <rect x="3"  y="9"  width="5"  height="1" fill="#FFFFFF"/>
      <rect x="4"  y="10" width="3"  height="1" fill="#FFFFFF"/>
      <!-- craters -->
      <rect x="6" y="3" width="2" height="2" fill="#C9CFD6"/>
      <rect x="3" y="6" width="2" height="2" fill="#C9CFD6"/>
      <rect x="6" y="7" width="1" height="1" fill="#DDE2E8"/>
      <rect x="4" y="4" width="1" height="1" fill="#DDE2E8"/>
      <rect x="2" y="2" width="1" height="1" fill="#E8ECF0"/>
    </g>

    <!-- ===== PIXEL MOUNTAINS: BACK RANGE ===== -->
    <g shape-rendering="crispEdges">
      <path fill="#1F2833" d="M0,160 20,160 20,140 40,140 40,150 60,150 60,120 80,120 80,135 100,135 100,155 120,155 120,130 140,130 140,110 160,110 160,140 180,140 180,160 200,160 200,145 220,145 220,125 240,125 240,150 260,150 260,170 280,170 280,150 300,150 300,130 320,130 320,115 340,115 340,140 360,140 360,160 380,160 380,145 400,145 400,125 420,125 420,105 440,105 440,130 460,130 460,150 480,150 480,165 500,165 500,145 520,145 520,120 540,120 540,140 560,140 560,160 580,160 580,150 600,150 600,130 620,130 620,110 640,110 640,135 660,135 660,155 680,155 680,140 700,140 700,120 720,120 720,145 740,145 740,165 760,165 760,150 780,150 780,160 800,160 800,200 0,200 Z"/>
      <!-- pixel snow caps -->
      <g fill="#FFFFFF" opacity="0.85">
        <rect x="62"  y="120" width="16" height="4"/>
        <rect x="142" y="110" width="16" height="4"/>
        <rect x="322" y="115" width="16" height="4"/>
        <rect x="422" y="105" width="16" height="4"/>
        <rect x="522" y="120" width="16" height="4"/>
        <rect x="622" y="110" width="16" height="4"/>
        <rect x="702" y="120" width="16" height="4"/>
      </g>
    </g>

    <!-- ===== PIXEL MOUNTAINS: FRONT RANGE ===== -->
    <path fill="#0B0C10" shape-rendering="crispEdges" d="M0,175 30,175 30,160 55,160 55,175 80,175 80,150 105,150 105,165 130,165 130,180 160,180 160,160 185,160 185,145 210,145 210,165 235,165 235,180 265,180 265,170 290,170 290,155 315,155 315,170 345,170 345,185 375,185 375,165 400,165 400,150 425,150 425,170 450,170 450,185 480,185 480,175 505,175 505,160 530,160 530,175 560,175 560,185 590,185 590,170 615,170 615,155 640,155 640,170 670,170 670,180 700,180 700,165 725,165 725,150 750,150 750,170 775,170 775,180 800,180 800,200 0,200 Z"/>
  </g>

  <!-- banner card border -->
  <rect x="4" y="4" width="792" height="196" rx="10" ry="10" fill="none" stroke="#1F2833" stroke-width="1.2"/>

  <!-- ============ TYPOGRAPHY (clean, no clutter) ============ -->
  <text x="172" y="106" class="name">z1xz</text>
  <text x="174" y="134" class="bio">claude tung sahur :&gt;</text>
  <g>
    <rect x="172" y="148" width="88" height="22" rx="11" ry="11" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
    <text x="187" y="163" class="pill-text">windyfax</text>
  </g>

  <!-- ============ AVATAR CUTOUT (Discord style) ============ -->
  <!-- cutout ring background matching profile body -->
  <circle cx="85" cy="185" r="50" fill="#0B0C10"/>
  <circle cx="85" cy="185" r="50" fill="none" stroke="#1F2833" stroke-width="1"/>
  <!-- dark placeholder background inside avatar -->
  <circle cx="85" cy="185" r="45" fill="#1F2833"/>

  <g clip-path="url(#avatar-clip)">
    <!-- subtle placeholder pixel stars (visible until base64 avatar is set) -->
    <g fill="#FFFFFF" shape-rendering="crispEdges">
      <rect class="av-tw" x="60"  y="163" width="2" height="2"/>
      <rect class="av-tw" x="102" y="172" width="2" height="2"/>
      <rect class="av-tw" x="78"  y="206" width="2" height="2"/>
      <rect class="av-tw" x="66"  y="190" width="2" height="2"/>
      <rect class="av-tw" x="98"  y="198" width="2" height="2"/>
    </g>
    <!-- ===== AVATAR IMAGE (Base64 data URI — GitHub safe) =====
         Replace the base64 string below with your own PNG data URI,
         e.g. href="data:image/png;base64,YOUR_BASE64_HERE" -->
    <image x="40" y="140" width="90" height="90" preserveAspectRatio="xMidYMid slice"
           href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="/>
  </g>

  <!-- crisp white ring frame -->
  <circle cx="85" cy="185" r="46.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
</svg>
